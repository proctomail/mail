<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Robot Check</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow:0 10px 25px rgba(0,0,0,.08);
      --accent:#2563eb;
      --ok:#16a34a;
    }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
    }
    .wrap{ width:min(560px, calc(100% - 32px)); }

    .captcha{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .captchaInner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px 16px;
    }

    .left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex: 1 1 auto;
    }

    .box{
      position:relative;
      width:28px;
      height:28px;
      border:2px solid var(--border);
      border-radius:4px;
      background:#fff;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .12s ease, border-color .15s, box-shadow .15s;
    }

    .box:hover{
      border-color:#94a3b8;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .box.press{ transform: scale(0.88); }
    .box.release{ transform: scale(1); }

    input[type="checkbox"]{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .spinner{
      width:16px;
      height:16px;
      border-radius:50%;
      border:2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display:none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .check{
      width:16px;
      height:16px;
      display:none;
    }
    .check path{ fill: var(--ok); }

    .label{
      font-size:16px;
      user-select:none;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
      min-width:160px;
    }
    .brandRow{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
    }
    .shield{
      width:18px;
      height:18px;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      text-align:right;
      line-height:1.2;
    }

    .footer{
      border-top:1px solid var(--border);
      padding:10px 16px 14px;
      background:linear-gradient(to bottom, #ffffff, #fbfbfd);
    }
    .sub{
      font-size:13px;
      color:var(--muted);
      line-height:1.35;
      margin:0;
    }
    .status{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
      min-height:1.2em;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .dot{
      width:8px; height:8px; border-radius:50%;
      background:#9ca3af;
    }
    .dot.ok{ background:var(--ok); }
    .dot.load{ background:var(--accent); }

    .disabled{
      opacity:.65;
      pointer-events:none;
      filter:saturate(.8);
    }

    .parodyTag{
      display:inline-block;
      margin-top:8px;
      font-size:11px;
      color:var(--muted);
    }
    .parodyTag strong{ color:#374151; }

    .robotIcon{
      margin-left:6px;
      font-size:18px;
      opacity:.9;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="captcha" id="captcha">
      <div class="captchaInner">
        <div class="left" id="leftArea">
          <label class="box" id="box" aria-label="Robot Check">
            <input id="robot" type="checkbox" />
            <span class="spinner" id="spin" aria-hidden="true"></span>
            <svg class="check" id="check" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.0 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path>
            </svg>
          </label>

          <label for="robot" class="label" id="robotLabel">
            Ich bin ein Roboter <span class="robotIcon">🤖</span>
          </label>
        </div>

        <div class="right" aria-hidden="true">
          <div class="brandRow">
            <svg class="shield" viewBox="0 0 24 24">
              <path fill="#9ca3af" d="M12 2 4 5v7c0 5 3.4 9.7 8 10 4.6-.3 8-5 8-10V5l-8-3zm0 2.2 6 2.3v5.5c0 3.9-2.4 7.7-6 8-3.6-.3-6-4.1-6-8V6.5l6-2.3z"/>
            </svg>
            <span id="badgeTitle">RobotCheck</span>
          </div>
          <div class="meta" id="badgeMeta">Prodigy • Local UI</div>
        </div>
      </div>

      <div class="footer">
        <p class="sub" id="sub">Nach der Bestätigung erfolgt eine kurze Überprüfung. Anschließend wirst du weitergeleitet..</p>
        <div class="status" aria-live="polite">
          <span class="dot" id="dot"></span>
          <span id="status"></span>
        </div>
        <span class="parodyTag" id="parodyTag"><strong>Hinweis:</strong> Extrem relevante Sicherheitsabfrage.</span>
      </div>
    </div>
  </div>

  <script>
    // DYNAMISCH ANGEPASST: Leitet zurück zur Startseite und übergibt den Erfolgs-Parameter
    const targetUrl = "index.html?captcha=success";

    const delayMs = 1400;
    const jitterMs = 600;
    const autoCheckProbability = 0.30; 
    const autoCheckDelayMs = 1200;     

    const lang = (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";

    const i18n = {
      de: {
        label: "Ich bin ein Roboter",
        sub: "Nach der Bestätigung erfolgt eine kurze Überprüfung. Anschließend wirst du weitergeleitet.",
        badgeTitle: "RobotCheck",
        badgeMeta: "Prodigy • Local UI",
        parodyTag: "<strong>Hinweis:</strong> Extrem relevante Sicherheitsabfrage.",
        loading: "Überprüfung läuft…",
        redirect: "Menschlichkeit erkannt. Weiterleitung…",
        messages: [
          "Analysiere Roboterprotokoll…",
          "Überprüfe CPU-Temperatur…",
          "Synchronisiere mit Skynet…",
          "Bestätige metallische Lebensform…"
        ],
        idle: ""
      },
      en: {
        label: "I am a robot",
        sub: "After confirmation we will verify and redirect you.",
        badgeTitle: "RobotCheck",
        badgeMeta: "Prodigy • Local UI",
        parodyTag: "<strong>Note:</strong> Extremely relevant security check.",
        loading: "Verification running…",
        redirect: "Human detected. Redirecting…",
        messages: [
          "Analyzing robot protocol…",
          "Checking CPU temperature…",
          "Syncing with Skynet…",
          "Confirming metallic lifeform…"
        ],
        idle: ""
      }
    };

    const box = document.getElementById("box");
    const robot = document.getElementById("robot");
    const spin = document.getElementById("spin");
    const check = document.getElementById("check");
    const robotLabel = document.getElementById("robotLabel");
    const sub = document.getElementById("sub");
    const statusEl = document.getElementById("status");
    const dot = document.getElementById("dot");
    const leftArea = document.getElementById("leftArea");
    const parodyTag = document.getElementById("parodyTag");
    const badgeTitle = document.getElementById("badgeTitle");
    const badgeMeta = document.getElementById("badgeMeta");

    robotLabel.innerHTML = `${i18n[lang].label} <span class="robotIcon">🤖</span>`;
    sub.textContent = i18n[lang].sub;
    badgeTitle.textContent = i18n[lang].badgeTitle;
    badgeMeta.textContent = i18n[lang].badgeMeta;
    parodyTag.innerHTML = i18n[lang].parodyTag;

    let started = false;
    let msgTimer = null;

    function setDot(state){
      dot.classList.remove("ok","load");
      if(state === "ok") dot.classList.add("ok");
      if(state === "load") dot.classList.add("load");
    }

    function showIdle(){
      statusEl.textContent = i18n[lang].idle;
      setDot("");
      spin.style.display = "none";
      check.style.display = "none";
    }

    function startMessages(){
      const msgs = i18n[lang].messages;
      statusEl.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      msgTimer = setInterval(() => {
        statusEl.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      }, 600);
    }

    function stopMessages(){
      if(msgTimer) clearInterval(msgTimer);
      msgTimer = null;
    }

    function startFlow() {
      if (started) return;
      started = true;

      leftArea.classList.add("disabled");
      check.style.display = "none";
      spin.style.display = "inline-block";

      setDot("load");
      statusEl.textContent = i18n[lang].loading;
      startMessages();

      const total = delayMs + Math.floor(Math.random() * jitterMs);

      setTimeout(() => {
        stopMessages();
        spin.style.display = "none";
        check.style.display = "inline-block";
        setDot("ok");
        statusEl.textContent = i18n[lang].redirect;
      }, Math.max(350, total - 450));

      setTimeout(() => {
        window.location.replace(targetUrl);
      }, total);
    }

    function pressThenStart(){
      box.classList.add("press");

      setTimeout(() => {
        box.classList.remove("press");
        box.classList.add("release");
      }, 90);

      setTimeout(() => {
        box.classList.remove("release");
      }, 180);

      setTimeout(() => {
        startFlow();
      }, 140);
    }

    robot.addEventListener("change", () => {
      if (robot.checked) {
        pressThenStart();
      } else if (!started) {
        showIdle();
      }
    });

    setTimeout(() => {
      if (started) return;
      if (robot.checked) return;
      if (Math.random() <= autoCheckProbability) {
        robot.checked = true;
        pressThenStart();
      }
    }, autoCheckDelayMs);

    showIdle();
  </script>
</body>
</html>
